services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: feedapp-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Pass1word"
      MSSQL_PID: "Developer"
    ports:
      - "1435:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Pass1word" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feedapp-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=AppDb;User Id=sa;Password=Pass1word;MultipleActiveResultSets=true;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - api-logs:/app/logs

volumes:
  sqlserver-data:
  api-logs:
